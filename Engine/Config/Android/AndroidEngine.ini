; Unreal Engine 4 Lite - Mobile Renderer Configuration
; Optimized rendering settings for Android devices

[Core.Engine]
; Disable expensive rendering features for mobile
bUseFixedPoolSize=True
MaxPoolSize=200

; Lighting optimization
bForwardShading=True
bUsePrecomputedLighting=True
bStationaryLightsUseStaticBranding=True

; Shadow optimization - disable for Lite
bEnableDistanceFieldShadows=False
bEnableReceivDecals=False
bEnableWPOIndirection=False

; Atmospheric effects - disable for Lite
bEnableAtmosphericFog=False
bEnableSkyAtmosphere=False
bEnableVolumetricFog=False

[/Script/Engine.Engine]
; Mobile-specific rendering settings
bUseEmulatedUniformBuffers=True
bAllowMultiGPURendering=False
bEnableRayTracing=False

; Disable advanced features
bEnableDistanceFieldGI=False
bEnableGlobalDistanceFieldUpdates=False
bEnableVirtualTextureSystem=False

[/Script/Engine.RendererSettings]
; Texture sampling limits
r.MaxAnisotropy=2
r.TextureStreamingPoolSize=256
r.Streaming.PoolSize=256

; Quality settings for mobile
r.MobileContentScaleFactor=0.8
r.MobileHDR=False
r.MobileHDREnable=False

; LOD optimization
r.MeshLODRadiusScale=1.5
r.SkeletalMeshLODBias=1

; Forward rendering optimization
r.ForwardShading=1
r.ForwardShadingQuality=1

; Disable expensive post-processing
r.FastBlurThreshold=0
r.EnableFFTBloom=0
r.MotionBlurQuality=0

; Lighting quality
r.LightPropagationVolume=0
r.DynamicGlobalIlluminationMethod=0

; Shadow settings
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=512
r.Shadow.CascadeCount=1
r.Shadow.DistanceScale=0.6

; Memory optimization
r.AllowOcclusionQueries=False
r.DBuffer=0
r.EarlyZPass=2

[/Script/Engine.StreamableManager]
; Asset loading optimization
MaxStreamingAIUpdateDistance=10000.0
MinStreamingAIUpdateDistance=5000.0
